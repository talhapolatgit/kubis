# KUBIS production — Coolify / Docker Compose
# Domain : https://yonetim.kubis.tr  →  A kaydı: 134.122.119.250
# Coolify'da app servisine domain ve port 8000 atanmalıdır.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME:-KUBIS}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://yonetim.kubis.tr}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kubis}
      DB_USERNAME: ${DB_USERNAME:-kubis}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      ISBNDB_API_KEY: ${ISBNDB_API_KEY:-}
      SOAP_KULLANICI_ADI: ${SOAP_KULLANICI_ADI:-}
      SOAP_SIFRE: ${SOAP_SIFRE:-}
      BEYOGLU_WEBHOOK_URL: ${BEYOGLU_WEBHOOK_URL:-}
      BEYOGLU_WEBHOOK_SECRET: ${BEYOGLU_WEBHOOK_SECRET:-}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --no-ansi > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:-kubis}
      MYSQL_USER: ${DB_USERNAME:-kubis}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  storage_data:
  db_data:
